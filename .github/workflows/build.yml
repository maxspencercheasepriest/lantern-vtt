# Builds the installers on real Windows, macOS and Linux machines, plus the Android app.
# Push a tag like v0.7.0 to build everything and publish a GitHub Release with the installers.
# "Run workflow" on the Actions tab builds them too, attached to the run instead of a release.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          # The two Macs build on different machine types: GitHub's Apple-silicon machines are sometimes
          # oversubscribed, and the Intel app also runs on Apple-silicon Macs (via Rosetta) as a fallback.
          - os: macos-latest
            args: --mac dmg --arm64
          - os: macos-15-intel
            args: --mac dmg --x64
          - os: ubuntu-latest
            args: --linux AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no Apple/Windows certificates; the Mac app is ad-hoc signed in build/after-pack.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Optional: set these repository secrets to sign the APK with your own key, so new versions
      # install over old ones. Without them the APK is debug-signed (see README → Android).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run mobile:sync
      - name: Signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lantern.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/lantern.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../../package.json').version")
          mkdir -p ../../dist
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../../dist/Lantern-VTT-$VERSION-android.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../../dist/Lantern-VTT-$VERSION-android.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    # publish whatever built, even if one platform's machines weren't available
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' }}
    needs: [test, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Lantern VTT ${{ github.ref_name }}
          files: installers/*
          body: |
            Lantern VTT ${{ github.ref_name }} installers.

            | | |
            |---|---|
            | Windows | `Lantern-VTT-Setup-*.exe` |
            | Mac with Apple silicon (M1 and later) | `Lantern-VTT-*-mac-arm64.dmg` |
            | Intel Mac (also runs on Apple silicon) | `Lantern-VTT-*-mac-x64.dmg` |
            | Linux | `Lantern-VTT-*-linux-x86_64.AppImage` |
            | Android tablet (joins games) | `Lantern-VTT-*-android.apk` |

            The apps aren't signed with a paid certificate, so the first launch needs one extra step:
            - **Windows:** on the SmartScreen warning choose *More info*, then *Run anyway*.
            - **Mac:** open the app once (it will be blocked), then go to *System Settings → Privacy & Security* and press *Open Anyway*.
            - **Android:** allow installing apps from your browser or file manager when asked.
