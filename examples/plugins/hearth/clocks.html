<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress clocks</title>
<style>
  :root { color-scheme: dark; --bg: #16151a; --panel: #211f27; --line: #3a3642; --ink: #f2e6c8; --muted: #a59d8c; --amber: #e8a33d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font: 600 20px Georgia, serif; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .add { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  input, select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--amber); color: #1a1408; border-color: var(--amber); font-weight: 600; }
  .clocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .clock { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .clock.full { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
  .clock b { display: block; margin-bottom: 6px; word-break: break-word; }
  svg { width: 110px; height: 110px; cursor: pointer; }
  .row { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .row button { padding: 2px 10px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
  <h1>Progress clocks</h1>
  <p>Everyone at the table sees the same clocks. Click a clock to fill the next slice, or use − and +.</p>
  <form class="add" id="add">
    <input name="name" placeholder="What's coming?" maxlength="40" required>
    <select name="size"><option>4</option><option selected>6</option><option>8</option><option>12</option></select>
    <button class="primary">Add a clock</button>
  </form>
  <div class="clocks" id="clocks"></div>
<script>
  // localStorage here is the campaign's shared storage (Lantern swaps it in for plugin panels and props)
  const KEY = 'hearth.clocks';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
  const save = (list) => localStorage.setItem(KEY, JSON.stringify(list));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  function face(n, size) {
    const r = 50, c = 55, parts = [];
    for (let i = 0; i < size; i++) {
      const a0 = (i / size) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / size) * Math.PI * 2 - Math.PI / 2;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      parts.push(`<path d="M${c},${c} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${i < n ? '#e8a33d' : '#2c2934'}" stroke="#16151a" stroke-width="2"/>`);
    }
    return `<svg viewBox="0 0 110 110">${parts.join('')}<circle cx="55" cy="55" r="50" fill="none" stroke="#a59d8c" stroke-width="2"/></svg>`;
  }
  function draw() {
    const list = load();
    document.getElementById('clocks').innerHTML = list.length ? list.map((k, i) => `
      <div class="clock${k.n >= k.size ? ' full' : ''}" data-i="${i}">
        <b>${esc(k.name)}</b>
        <span data-act="up">${face(k.n, k.size)}</span>
        <div class="row"><button data-act="down" title="Clear a slice">−</button><button data-act="up" title="Fill a slice">+</button><button data-act="del" title="Remove">✕</button></div>
      </div>`).join('') : '<span class="empty">No clocks yet.</span>';
  }
  document.getElementById('add').onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const list = load();
    list.push({ name: f.name.value.trim() || 'Clock', size: +f.size.value, n: 0 });
    save(list); f.reset(); draw();
  };
  document.getElementById('clocks').onclick = (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act, el = e.target.closest('[data-i]');
    if (!act || !el) return;
    const list = load(), k = list[+el.dataset.i];
    if (!k) return;
    if (act === 'up') k.n = Math.min(k.size, k.n + 1);
    if (act === 'down') k.n = Math.max(0, k.n - 1);
    if (act === 'del') list.splice(+el.dataset.i, 1);
    save(list); draw();
    if (act === 'up' && k.n === k.size && window.lantern?.chat) window.lantern.chat(`⏰ “${k.name}” is full.`);
  };
  addEventListener('storage', draw); // someone else changed a clock
  draw();
</script>
</body>
</html>
