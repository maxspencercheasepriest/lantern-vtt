<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looking for group — Lantern</title>
  <meta name="description" content="Tabletop roleplaying games looking for players.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23e8a33d'/%3E%3C/svg%3E">
</head>
<body class="home">
  <div class="dash">
    <header class="dash-head">
      <div class="brand"><span class="flame"></span>Lantern</div>
      <span class="grow"></span>
      <a class="btn ghost" id="lfg-home" href="/home.html">Log in</a>
    </header>
    <main class="dash-main lfg-public">
      <div class="dash-title"><h1>Looking for group</h1></div>
      <p class="muted page-intro">Tabletop roleplaying games on this Lantern that want players. Ask to join one: say hello, and the GM will say yes or no. If they say yes, you play right here in your browser.</p>
      <div id="lfg" class="lfg-list"></div>
      <p id="lfg-empty" class="empty muted" hidden>No games are looking for players just now. Check back soon.</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/js/lfg.js"></script>
</body>
</html>
